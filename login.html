<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dashboard - PAC PSNU Pagar Nusa Kemang</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Script Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { 
            --pn-header-footer: #19183B;
            --pn-base: #E7F2EF;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--pn-base); color: #1e293b; }
        .nav-font { font-family: 'Oswald', sans-serif; }
        .bg-pn-hf { background-color: var(--pn-header-footer); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#19183B] selection:text-white">

    <!-- HEADER UTAMA -->
    <header class="bg-pn-hf py-4 shadow-md border-b border-slate-800">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center max-w-7xl">
            <div class="flex items-center space-x-3.5">
                <img src="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ" alt="Logo Pagar Nusa" class="h-10 md:h-12 w-auto object-contain">
                <div class="text-left border-l-2 border-white/20 pl-3.5">
                    <h1 class="text-lg md:text-xl font-bold text-white tracking-normal leading-none nav-font uppercase">PAC PSNU PAGAR NUSA</h1>
                    <p class="text-amber-400 font-semibold text-xs tracking-wide uppercase mt-1">Kecamatan Kemang</p>
                </div>
            </div>
            <div>
                <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold uppercase tracking-wider transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Beranda
                </a>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA LOGIN -->
    <main class="container mx-auto px-4 py-12 flex items-center justify-center flex-grow max-w-md">
        <div class="bg-white p-8 rounded-md shadow-sm border border-slate-200 w-full">
            <div class="text-center mb-6">
                <div class="inline-block bg-[#19183B] text-amber-400 font-bold p-3 rounded-full text-xl mb-2 shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 nav-font uppercase">Panel Pengurus</h2>
                <p class="text-slate-500 text-sm mt-1">Masuk dengan kredensial atau verifikasi akun Google</p>
            </div>

            <div id="error-alert" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-sm mb-4 text-center font-medium"></div>

            <!-- Form Login Manual (Username/Email & Password) -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Username / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-sm focus:outline-none focus:border-[#19183B] text-sm bg-slate-50/50" placeholder="Username atau email pengurus">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-sm focus:outline-none focus:border-[#19183B] text-sm bg-slate-50/50" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-[#19183B] hover:bg-slate-800 text-white font-bold py-2.5 rounded-sm transition text-xs uppercase tracking-widest shadow-sm cursor-pointer">
                    Masuk Sistem
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400 font-bold">Atau</span></div>
            </div>

            <!-- Tombol Google Sign-In / Verifikasi -->
            <div class="flex justify-center">
                <div id="g_id_onload"
                     data-client_id="8692513970-thvc9jrlj1q0j6ukfaha3o62fclqleeb.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" 
                     data-type="standard" 
                     data-shape="rectangular" 
                     data-theme="outline" 
                     data-text="signin_with" 
                     data-size="large" 
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-pn-hf border-t border-slate-800 py-6 text-white text-center text-xs">
        <div class="container mx-auto px-4">
            <p class="font-bold tracking-wide uppercase nav-font text-amber-400 mb-1">PAC PSNU PAGARNUSA KEMANG</p>
            <p class="text-slate-400">© 2026 Lembaga IT & Infokom PAC Pagar Nusa Kecamatan Kemang</p>
        </div>
    </footer>

    <script>
        const USERS_API_URL = "https://script.google.com/macros/s/AKfycbxLs1nDf7wYLjp_QV0IqT9VSqq4iVTDWy_5fAJShgIzqk5VAJQ9H8Ep7rDrFeoQznuq/exec?action=users";

        // Logika Login Manual
        async function handleLogin(event) {
            event.preventDefault();
            const userInp = document.getElementById("username").value.trim().toLowerCase();
            const passInp = document.getElementById("password").value.trim();
            const btn = document.getElementById("btn-submit");
            const alertBox = document.getElementById("error-alert");

            btn.disabled = true;
            btn.innerText = "Memeriksa...";
            alertBox.classList.add("hidden");

            try {
                const response = await fetch(USERS_API_URL);
                const users = await response.json();

                const foundUser = users.find(u => 
                    (String(u.username).toLowerCase() === userInp || String(u.email).toLowerCase() === userInp) && 
                    String(u.password) === passInp
                );

                if (foundUser) {
                    localStorage.setItem("pagarnusa_user", foundUser.nama_lengkap);
                    localStorage.setItem("pagarnusa_role", foundUser.role);
                    window.location.href = "admin.html";
                } else {
                    alertBox.innerText = "Username/Email atau password salah!";
                    alertBox.classList.remove("hidden");
                    btn.disabled = false;
                    btn.innerText = "Masuk Sistem";
                }
            } catch (error) {
                alertBox.innerText = "Terjadi kendala koneksi ke server database.";
                alertBox.classList.remove("hidden");
                btn.disabled = false;
                btn.innerText = "Masuk Sistem";
            }
        }

        // Dekode Token JWT Google
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString('16')).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Logika Login Google
        async function handleGoogleLogin(response) {
            const alertBox = document.getElementById("error-alert");
            alertBox.classList.add("hidden");

            try {
                const responsePayload = decodeJwtResponse(response.credential);
                const userEmail = responsePayload.email;

                const res = await fetch(USERS_API_URL);
                const users = await res.json();

                const foundUser = users.find(u => String(u.email).toLowerCase() === String(userEmail).toLowerCase());

                if (foundUser) {
                    localStorage.setItem("pagarnusa_user", foundUser.nama_lengkap);
                    localStorage.setItem("pagarnusa_role", foundUser.role);
                    window.location.href = "admin.html";
                } else {
                    alertBox.innerText = `Email (${userEmail}) tidak terdaftar sebagai pengurus!`;
                    alertBox.classList.remove("hidden");
                }
            } catch (error) {
                alertBox.innerText = "Terjadi kendala koneksi ke server database.";
                alertBox.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
