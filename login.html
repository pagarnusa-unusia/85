<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Dashboard - Pagar Nusa Kemang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="inline-block bg-emerald-700 text-white font-bold p-3 rounded-full text-xl mb-2 shadow-sm">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Panel Pengurus</h2>
      <p class="text-slate-500 text-sm mt-1">Silakan masuk untuk mengelola artikel berita</p>
    </div>

    <div id="error-alert" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-lg mb-4 text-center">
      Username atau password salah!
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
          <input type="text" id="username" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-emerald-600 text-sm" placeholder="Masukkan username">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="password" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-emerald-600 text-sm" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-sm">
        Masuk Sistem
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-slate-500 hover:text-emerald-700 transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda Website
      </a>
    </div>
  </div>

  <script>
    // GANTI dengan URL Web App Google Apps Script Anda yang baru
    const USERS_API_URL = "https://script.google.com/macros/s/AKfycbxLs1nDf7wYLjp_QV0IqT9VSqq4iVTDWy_5fAJShgIzqk5VAJQ9H8Ep7rDrFeoQznuq/exec?action=users";

    async function handleLogin(event) {
      event.preventDefault();
      const userInp = document.getElementById("username").value.trim();
      const passInp = document.getElementById("password").value.trim();
      const btn = document.getElementById("btn-submit");
      const alertBox = document.getElementById("error-alert");

      btn.disabled = true;
      btn.innerText = "Memeriksa...";
      alertBox.classList.add("hidden");

      try {
        const response = await fetch(USERS_API_URL);
        const users = await response.json();

        // Cari user yang cocok
        const foundUser = users.find(u => u.username === userInp && String(u.password) === passInp);

        if (foundUser) {
          // Simpan sesi login ke browser (localStorage)
          localStorage.setItem("pagarnusa_user", foundUser.nama_lengkap);
          localStorage.setItem("pagarnusa_role", foundUser.role); // 'super_admin' atau 'admin'

          // Lempar ke halaman dashboard admin
          window.location.href = "admin.html";
        } else {
          alertBox.classList.remove("hidden");
          btn.disabled = false;
          btn.innerText = "Masuk Sistem";
        }
      } catch (error) {
        alert("Terjadi kendala koneksi ke server database.");
        btn.disabled = false;
        btn.innerText = "Masuk Sistem";
      }
    }
  </script>
</body>
</html>
