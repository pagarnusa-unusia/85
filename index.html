<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="icon" href="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pn-green-dark: #0f2e22;
            --pn-green: #1b4d3e;
            --pn-gold: #d4af37;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
        }
        .nav-font { font-family: 'Oswald', sans-serif; }
        .bg-pn { background-color: var(--pn-green); }
        .text-pn { color: var(--pn-green); }
        
        /* Animasi mengambang untuk ornamen */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-pn selection:text-white">

    <!-- Ornamen Background (Pola dekoratif transparan) -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">

        <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-amber-500/5 rounded-full blur-3xl"></div>

        <div class="relative inline-block mb-6 animate-float">

        </div>

        <!-- Ikon Peringatan / Pengembangan -->

            <span class="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
                Tahap Pengembangan
            </span>
        </div>

        <h1 class="nav-font text-2xl md:text-3xl font-bold text-slate-800 uppercase tracking-tight mb-3">
            Website Sedang Disempurnakan
        </h1>
        
        <p class="text-slate-500 text-sm md:text-base leading-relaxed mb-8">
            Mohon maaf, halaman yang Anda tuju saat ini sedang dalam tahap perbaikan dan pengembangan oleh tim <strong>IT & Infokom</strong> untuk memberikan pengalaman yang lebih baik.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto bg-pn hover:bg-[#0f2e22] text-white px-8 py-3.5 rounded-xl text-xs font-bold uppercase tracking-widest transition-all shadow-lg shadow-emerald-900/20 transform active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
