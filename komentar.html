<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentar & Masukan - PAC Pagarnusa Kemang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-pn-hf {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white py-2.5 sticky top-0 z-50 shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <img src="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ" alt="Logo Pagar Nusa" class="h-8 w-auto object-contain">
                <div class="text-left border-l-2 border-slate-300 pl-2.5">
                    <h1 class="text-xs md:text-sm font-bold text-[#19183B] leading-none nav-font uppercase">PAC PSNU PAGARNUSA</h1>
                    <p class="text-slate-500 font-semibold text-[10px] tracking-wide uppercase mt-0.5">Kecamatan Kemang</p>
                </div>
            </div>

            <!-- Tombol Kembali (Bisa disesuaikan mengarah ke halaman sebelumnya) -->
            <a href="index.html" class="inline-flex items-center text-xs font-semibold text-slate-700 hover:text-[#19183B] transition bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-sm uppercase tracking-wide nav-font">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Kembali
            </a>
        </div>
    </header>

    <!-- Main Content Form -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-4 py-8 md:py-12">
        <div class="bg-white border border-slate-200 border-t-4 border-t-[#19183B] rounded-lg shadow-md p-6 md:p-8">
            
            <div class="flex justify-center mb-3">
                <div class="bg-slate-100 p-3.5 rounded-full text-[#19183B]">
                    <i class="fa-solid fa-comments text-2xl"></i>
                </div>
            </div>
            <h2 class="text-xl font-bold text-[#19183B] mb-1 uppercase text-center">Kritik & Saran</h2>
            <p class="text-sm text-slate-500 text-center mb-8">Tinggalkan pesan, komentar, atau pertanyaan Anda di bawah ini. Masukan Anda sangat berarti bagi kami.</p>

            <!-- Form Komentar -->
            <form id="komentarForm" class="space-y-6">
                
                <!-- Input Nama -->
                <div>
                    <label for="nama" class="block text-sm font-semibold text-slate-700 mb-1.5">
                        <i class="fa-regular fa-user text-[#19183B] opacity-80 mr-1"></i> Nama Lengkap (Opsional)
                    </label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda (kosongkan jika ingin anonim)" 
                        class="w-full border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#19183B] focus:border-[#19183B] focus:bg-slate-50 transition-all">
                </div>

                <!-- Input Asal/Instansi -->
                <div>
                    <label for="asal" class="block text-sm font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-location-dot text-[#19183B] opacity-80 mr-1"></i> Asal Rayon / Ranting (Opsional)
                    </label>
                    <input type="text" id="asal" name="asal" placeholder="Contoh: Ranting Tegal / Masyarakat Umum" 
                        class="w-full border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#19183B] focus:border-[#19183B] focus:bg-slate-50 transition-all">
                </div>

                <!-- Input Pesan -->
                <div>
                    <label for="pesan" class="block text-sm font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-pen-clip text-[#19183B] opacity-80 mr-1"></i> Pesan / Komentar <span class="text-red-500">*</span>
                    </label>
                    <textarea id="pesan" name="pesan" rows="5" required placeholder="Tulis masukan, kritik, atau saran Anda di sini..." 
                        class="w-full border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#19183B] focus:border-[#19183B] focus:bg-slate-50 transition-all resize-y"></textarea>
                </div>

                <!-- Tombol Submit -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#19183B] text-white font-bold py-3.5 rounded-md hover:bg-[#2b295c] hover:-translate-y-0.5 hover:shadow-lg transition-all duration-300 uppercase text-sm tracking-wide shadow-sm flex justify-center items-center">
                        <i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pesan
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-pn-hf text-slate-300 py-6 text-xs text-center border-t border-slate-800 mt-auto">
        <div class="max-w-5xl mx-auto px-4">
            <p class="font-semibold text-white mb-1 nav-font uppercase tracking-wide text-xs">PAC PSNU PAGAR NUSA KECAMATAN KEMANG</p>
            <p class="text-slate-400 text-[11px]">&copy; 2026 Media Pac Pagarnusa Kecamatan Kemang.</p>
        </div>
    </footer>

<script>
    // Logika Pengiriman Data Komentar Ke Google Spreadsheet
    // Ganti URL di bawah ini dengan URL Google Apps Script yang mengurus komentar jika berbeda dengan database santri
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxLs1nDf7wYLjp_QV0IqT9VSqq4iVTDWy_5fAJShgIzqk5VAJQ9H8Ep7rDrFeoQznuq/exec'; 
    const form = document.getElementById('komentarForm');
    const btnSubmit = form.querySelector('button[type="submit"]');
    const iconSubmit = '<i class="fa-solid fa-paper-plane mr-2"></i>';

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengirim...';

        const formData = new FormData(form);

        // Bungkus data ke format JSON
        // Pastikan Anda menangkap "action: add_comment" di script Kode.gs Google Sheet Anda nantinya
        const payload = {
            action: "add_comment",
            nama: formData.get('nama') || "Anonim",
            asal: formData.get('asal') || "-",
            pesan: formData.get('pesan')
        };

        fetch(scriptURL, { 
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('Terima kasih! Pesan dan komentar Anda telah berhasil dikirim.');
            form.reset();
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Gagal mengirim pesan, periksa koneksi internet Anda.');
        })
        .finally(() => {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = iconSubmit + ' Kirim Pesan';
        });
    });
</script>
</body>
</html>
