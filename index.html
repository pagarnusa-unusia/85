<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Sistem Dalam Pembaruan | PAC Pagar Nusa Kemang</title>
    <meta name="description" content="Website PAC Pagar Nusa Kemang sedang dalam tahap pengembangan dan pemeliharaan sistem.">
    
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pn-green-dark: #0f2e22;
            --pn-green: #1b4d3e;
            --pn-gold: #d4af37;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9; /* Slate 100 untuk kontras yang lebih baik di HP */
            -webkit-font-smoothing: antialiased;
        }
        .nav-font { font-family: 'Oswald', sans-serif; }
        .text-pn { color: var(--pn-green); }
        .bg-pn { background-color: var(--pn-green); }
        
        /* Animasi Profesional */
        .pulse-ring {
            animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.05); }
        }
        .spin-slow {
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center p-4 md:p-6 relative selection:bg-pn selection:text-white">

    <!-- Latar Belakang Elegan -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex justify-center items-center opacity-30">
        <div class="w-[120vw] h-[120vw] max-w-[800px] max-h-[800px] bg-gradient-to-tr from-emerald-100 to-transparent rounded-full blur-[80px]"></div>
    </div>

    <main class="bg-white max-w-lg w-full rounded-[2rem] shadow-2xl shadow-slate-200/60 p-8 md:p-12 text-center relative z-10 border border-slate-100/50">
        
        <!-- Logo dengan Penanganan Error untuk iOS Safari -->
        <div class="relative inline-flex items-center justify-center mb-8">
            <div class="absolute inset-0 bg-emerald-50 rounded-full blur-2xl pulse-ring"></div>
            <!-- Menggunakan properti onerror agar jika link G-Drive diblokir HP, logo tidak error -->
            <img src="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ" 
                 alt="Logo Pagar Nusa" 
                 class="relative h-20 md:h-24 w-auto object-contain drop-shadow-sm"
                 onerror="this.outerHTML='<div class=\'h-20 w-20 bg-[#1b4d3e] text-white rounded-full flex items-center justify-center font-bold text-2xl nav-font shadow-lg\'>PN</div>'">
        </div>

        <!-- Indikator Status Maintenance -->
        <div class="inline-flex items-center justify-center gap-2 bg-slate-50 border border-slate-100 px-4 py-2 rounded-2xl mb-6 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500 spin-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="text-[11px] font-bold text-slate-600 uppercase tracking-widest">Pembaruan Sistem</span>
        </div>

        <h1 class="nav-font text-3xl md:text-4xl font-bold text-slate-800 uppercase tracking-tight mb-4 leading-tight">
            Sedang Dalam <br class="hidden sm:block"><span class="text-pn">Pengembangan</span>
        </h1>
        
        <p class="text-slate-500 text-[13px] md:text-sm leading-relaxed mb-10 px-2 font-medium">
            Halaman ini sedang disempurnakan oleh tim <strong>IT & Infokom PAC Kemang</strong>. Kami sedang menyiapkan pembaruan fitur untuk kenyamanan akses Anda.
        </p>

        <!-- Progress Bar Visual -->
        <div class="w-full bg-slate-100 rounded-full h-1.5 mb-10 overflow-hidden">
            <div class="bg-amber-500 h-1.5 rounded-full relative w-full">
                <div class="absolute inset-0 bg-white/30 w-full h-full animate-[slide_2s_ease-in-out_infinite]"></div>
            </div>
        </div>

        <a href="index.html" class="flex items-center justify-center gap-3 w-full bg-pn hover:bg-[#0f2e22] text-white px-6 py-4 md:py-3.5 rounded-2xl text-[11px] md:text-xs font-bold uppercase tracking-[0.2em] transition-all shadow-xl shadow-emerald-900/20 active:scale-95 touch-manipulation">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Kembali ke Beranda
        </a>
    </main>

    <footer class="mt-8 text-center relative z-10">
        <p class="text-[10px] text-slate-400 font-bold tracking-[0.3em] uppercase">
            © 2026 PAC PSNU PAGARNUSA KEMANG
        </p>
    </footer>

    <style>
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</body>
</html>
