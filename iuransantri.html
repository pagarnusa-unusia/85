<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Iuran Santri - PAC PSNU PAGARNUSA</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ">
    
    <!-- Tailwind & SweetAlert2 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#056839',
                            dark: '#044d2b',
                            light: '#0b8f4d'
                        }
                    },
                    fontFamily: { sans: ['Roboto', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f5f5f5; color: #222222; }
        .smooth-transition { transition: all 0.3s ease; }
        input[type="file"]::file-selector-button {
            background-color: #056839; color: white; border: none; padding: 6px 16px;
            border-radius: 4px; cursor: pointer; margin-right: 12px; font-size: 0.75rem; font-weight: 500; transition: all 0.3s ease;
        }
        input[type="file"]::file-selector-button:hover { background-color: #044d2b; }
        .form-input:focus { box-shadow: inset 0 -2px 0 0 #056839; border-color: transparent; }
        .tab-active { color: #056839 !important; border-bottom: 3px solid #056839 !important; font-weight: 700 !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between">

<!-- HEADER -->
<header class="bg-white py-3 sticky top-0 z-[60] shadow-sm border-b-4 border-brand">
    <div class="container mx-auto px-4 md:px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3.5">
            <img src="https://lh3.googleusercontent.com/d/1drM76LlU3sdqpwo-Urq7ZULoyORC0UMQ" alt="Logo" class="h-9 md:h-11 w-auto object-contain">
            <div class="text-left pl-3 border-l-2 border-gray-200">
                <h1 class="text-base md:text-lg font-black text-brand-dark tracking-tighter leading-none uppercase">PAC PSNU PAGARNUSA</h1>
                <p class="text-brand text-[10px] md:text-xs font-extrabold tracking-normal uppercase mt-1">Kecamatan Kemang</p>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-3">
            <span class="text-xs font-medium text-brand font-bold bg-[#f0f9f4] px-3 py-1.5 rounded border border-[#cce8d9]">
                Sistem Iuran Santri
            </span>
        </div>
    </div>
</header>



<main class="flex-grow py-6 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto relative min-h-[400px]">
        
        <!-- ============================================== -->
        <!-- MENU 1: INPUT IURAN                            -->
        <!-- ============================================== -->
        <div id="view-input" class="">
            <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-gray-50 px-5 py-4 border-b border-gray-100">
                    <h3 class="text-sm font-medium text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice-dollar text-brand text-lg"></i> Form Catat Iuran Santri
                    </h3>
                </div>
                
                <form id="iuranForm" class="p-5 sm:p-6 space-y-5">
                    
                    <!-- TIMELINE -->
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1.5">Tanggal & Jam Pembayaran</label>
                        <input type="datetime-local" id="timeline" required 
                            class="form-input w-full px-3 py-2.5 border border-gray-300 rounded text-sm focus:outline-none bg-white">
                    </div>

                    <!-- NAMA & SABUK -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1.5">Nama Lengkap Santri</label>
                            <input type="text" id="nama" required placeholder="Contoh: Ahmad Fadli" 
                                class="form-input w-full px-3 py-2.5 border border-gray-300 rounded text-sm focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1.5">Tingkatan Sabuk</label>
                            <select id="sabuk" required class="form-input w-full px-3 py-2.5 border border-gray-300 rounded text-sm focus:outline-none bg-white">
                                <option value="" disabled selected>Pilih Sabuk...</option>
                                <option value="Pra Polos">Pra Polos</option>
                                <option value="Polos">Polos</option>
                                <option value="Putih">Putih</option>
                                <option value="Kuning">Kuning</option>
                                <option value="Merah">Merah</option>
                                <option value="Biru">Biru</option>
                                <option value="Cokelat">Cokelat</option>
                            </select>
                        </div>
                    </div>

                    <!-- BULAN & NOMINAL -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1.5">Iuran Untuk Bulan</label>
                            <select id="bulan" required class="form-input w-full px-3 py-2.5 border border-gray-300 rounded text-sm focus:outline-none bg-white">
                                <option value="" disabled selected>Pilih Bulan...</option>
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1.5">Nominal (Rp)</label>
                            <input type="number" id="nominal" required placeholder="Contoh: 50000" min="1" 
                                class="form-input w-full px-3 py-2.5 border border-gray-300 rounded text-sm focus:outline-none bg-white">
                        </div>
                    </div>

                    <!-- BUKTI TRANSAKSI -->
                    <div class="pt-4 border-t border-dashed border-gray-200">
                        <label class="block text-xs font-medium text-gray-700 mb-1.5">Bukti Pembayaran (Struk/Transfer)</label>
                        <input type="file" id="buktiFile" accept="image/*" class="w-full text-sm text-gray-500">
                        <div class="mt-3">
                            <img id="imgPreview" class="hidden w-32 h-32 object-cover rounded border border-gray-200 shadow-sm" alt="Preview Bukti">
                        </div>
                    </div>

                    <!-- TOMBOL -->
                    <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
                        <button type="button" onclick="resetForm()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 text-sm font-medium py-2.5 px-5 rounded smooth-transition">
                            Reset
                        </button>
                        <button type="submit" id="btnSubmit" class="bg-brand hover:bg-brand-dark text-white text-sm font-medium py-2.5 px-8 rounded smooth-transition w-full sm:w-auto">
                            <i class="fa-solid fa-save mr-2"></i> Simpan Data Iuran
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- MENU 2: DASHBOARD (SEMENTARA KOSONG/TAMPILAN)  -->
        <!-- ============================================== -->
        <div id="view-dashboard" class="hidden">
            <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8 text-center text-gray-500">
                <i class="fa-solid fa-table text-4xl mb-3 text-gray-300"></i>
                <p class="text-sm font-medium">Data Iuran berhasil disinkronisasi ke Google Sheets.</p>
                <p class="text-xs mt-1">Silakan cek spreadsheet "Iuran_Santri" untuk melihat rekapitulasi data.</p>
            </div>
        </div>

    </div>
</main>

<script>
    // URL WEB APP GOOGLE APPS SCRIPT (Sesuaikan dengan URL asli Anda)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG6cwvQb4_vQcrFlx2NjwxMVLYPeSxZegTQaG0F-nHxMKOp09ePhdH1yFOdarfG_Z54A/exec";
    const SHEET_NAME = "Iuran_Santri"; 

    function switchTab(tabName) {
        const viewDashboard = document.getElementById('view-dashboard');
        const viewInput = document.getElementById('view-input');
        const btnDash = document.getElementById('tab-dashboard');
        const btnInput = document.getElementById('tab-input');

        if (tabName === 'dashboard') {
            viewDashboard.classList.remove('hidden');
            viewInput.classList.add('hidden');
            btnDash.classList.add('tab-active');
            btnInput.classList.remove('tab-active');
        } else {
            viewDashboard.classList.add('hidden');
            viewInput.classList.remove('hidden');
            btnDash.classList.remove('tab-active');
            btnInput.classList.add('tab-active');
        }
    }

    function setTimelineToNow() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('timeline').value = now.toISOString().slice(0, 16);
    }

    document.getElementById('buktiFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById('imgPreview');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                preview.src = evt.target.result;
                preview.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        } else {
            preview.classList.add('hidden');
            preview.src = '';
        }
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.onload = () => resolve({ base64: reader.result.split(',')[1], type: file.type, name: file.name });
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('iuranForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        const originalText = btnSubmit.innerHTML;
        
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengirim...';
        btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');

        try {
            const fileInput = document.getElementById('buktiFile');
            const fileData = fileInput.files.length > 0 ? await fileToBase64(fileInput.files[0]) : null;

            const rawTimeline = document.getElementById('timeline').value; 
            const formattedTimeline = rawTimeline.replace('T', ' ');

            // PAYLOAD SESUAI DENGAN KOLOM IURAN SANTRI
            const payload = {
                action: "insert",
                sheetName: SHEET_NAME,
                timeline: formattedTimeline,
                nama: document.getElementById('nama').value,
                sabuk: document.getElementById('sabuk').value,
                bulan: document.getElementById('bulan').value,
                nominal: parseFloat(document.getElementById('nominal').value) || 0,
                fileData: fileData
            };

            await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            Swal.fire({
                icon: 'success',
                title: 'Berhasil',
                text: 'Data iuran santri berhasil disimpan!',
                confirmButtonColor: '#056839'
            });
            resetForm();
            
        } catch (error) {
            console.error("Error:", error);
            Swal.fire({
                icon: 'error',
                title: 'Gagal',
                text: 'Periksa koneksi internet Anda.',
                confirmButtonColor: '#056839'
            });
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = originalText;
            btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    });

    function resetForm() {
        document.getElementById('iuranForm').reset();
        setTimelineToNow();
        document.getElementById('imgPreview').classList.add('hidden');
        document.getElementById('imgPreview').src = '';
    }

    window.onload = setTimelineToNow;
</script>

</body>
</html>
